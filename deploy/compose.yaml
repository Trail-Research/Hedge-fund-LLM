name: hedge-fund-demo
services:
  app:
    build: ..
    image: hedge-fund-demo:latest
    ports:
      - "127.0.0.1:3004:8501"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    mem_limit: 768m
    cpus: "0.5"
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
